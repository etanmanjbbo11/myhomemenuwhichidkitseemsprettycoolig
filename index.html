<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ethan's Home Menu</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="version-tag" id="versionTag">Ethan's Home Menu - v12.0</div>
<div id="pinOverlay" class="pin-overlay">
    <div class="pin-card" id="pinCard">
      <div class="pin-icon" style="font-size: 3.5rem; margin-bottom: 12px;">🔒</div>
      <h2 style="font-size: 1.75rem; font-weight: 700; margin-bottom: 6px;">Locked</h2>
      <p style="font-size: 1rem; color: var(--text-muted); margin-bottom: 20px;">Enter PIN To Access</p>
      <input type="password" id="pinInput" inputmode="numeric" class="pin-input" maxlength="4" autofocus autocomplete="off" />
      <div id="pinError" style="color: #ef4444; font-size: 0.85rem; margin-bottom: 12px;"></div>
    </div>

    <div class="pin-sidebar">

      <div class="field-group">
        <label>Quick Access</label>
        <div class="pin-shortcuts">
          <a href="https://github.com" target="_blank" class="app-card">
            <div class="app-icon">
              <img src="https://cdn.simpleicons.org/github/white" alt="GitHub">
            </div>
            <div class="app-info">
              <div class="app-name">GitHub</div>
              <span class="app-desc">View My GitHub Repository!</span>
            </div>
          </a>

          <a href="https://mail.google.com" target="_blank" class="app-card">
            <div class="app-icon">
              <img src="https://cdn.simpleicons.org/gmail/white" alt="Gmail">
            </div>
            <div class="app-info">
              <div class="app-name">Gmail</div>
              <span class="app-desc">Email</span>
            </div>
          </a>

          <a href="https://www.youtube.com" target="_blank" class="app-card">
            <div class="app-icon">
              <img src="https://cdn.simpleicons.org/youtube/white" alt="YouTube">
            </div>
            <div class="app-info">
              <div class="app-name">YouTube</div>
              <span class="app-desc">Video Streaming</span>
            </div>
          </a>
        </div>
        <div class="pin-datetime" id="pinDateTime">Loading...</div>
      <div class="field-group">
        <label>Options</label>
        <div class="pin-shortcuts">
          <button type="button" class="app-card sidebar-action-btn" id="pinRefreshBtn">
            <div class="app-icon">
              <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="23 4 23 10 17 10"></polyline>
                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
              </svg>
            </div>
            <div class="app-info">
              <div class="app-name">Reload Page</div>
              <span class="app-desc">Refresh Session</span>
            </div>
          </button>

          <button type="button" class="app-card sidebar-action-btn shutdown-card" id="pinCloseBtn">
            <div class="app-icon">
              <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
                <line x1="12" y1="2" x2="12" y2="12"></line>
              </svg>
            </div>
            <div class="app-info">
              <div class="app-name">Shut Down</div>
              <span class="app-desc">Exit Session</span>
            </div>
          </button>
        </div>
      </div>
</div>
    </div>
  </div>

  <div class="header-btns">
    <button class="icon-btn-circle" id="appGridBtn" aria-label="App Grid" title="App Grid">
      <svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
        <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
        <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
        <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
      </svg>
    </button>
    <button class="icon-btn-circle" id="quickControlsBtn" aria-label="Quick Controls" title="Quick Controls">
      <svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path>
      </svg>
    </button>
    <button class="icon-btn-circle" id="gearBtn" aria-label="Settings" title="Settings">
      <svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
  </div>

  <div class="wrap">
    <div class="eyebrow"><span class="dot"></span><span id="tzLabel">Local time</span></div>
    <h1 class="clock" id="clock">00:00<span class="sec" id="clockSec">:00</span></h1>
    <div class="date-line" id="dateLine">Loading date…</div>

    <div class="greeting" id="greeting">Hello</div>
    <div class="message" id="message"></div>

    <div class="search-block">
      <div class="engine-toggle" id="engineToggle">
        <button data-engine="google">Google</button>
        <button data-engine="youtube">YouTube</button>
        <button data-engine="instagram">Instagram</button>
        <button data-engine="bible_en">Bible</button>
        <button data-engine="url">URL</button>
      </div>
      <form class="search-form" id="searchForm">
        <input type="text" id="searchInput" placeholder="Search Google, YouTube, Bible, or enter URL..." autocomplete="off">
        <button type="submit" aria-label="Search">
          <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
      </form>
    </div>

    <div class="shortcuts" id="shortcuts"></div>
  </div>

  <div class="overlay" id="overlay"></div>

  <div class="drawer" id="quickControlsModal">
    <button class="drawer-close" id="quickControlsClose" aria-label="Close">
      <svg viewBox="0 0 24 24" stroke-width="2" fill="none"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
    <h2>Quick Controls</h2>
    <div style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 20px;">System & Quick Actions</div>

    <div class="actions-grid">
      <button type="button" class="app-card" id="ctrlLockBtn">
        <div class="app-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <div class="app-name">Lock Site</div>
      </button>
      <button type="button" class="app-card" id="ctrlFullscreenBtn">
        <div class="app-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
          </svg>
        </div>
        <div class="app-name">Fullscreen</div>
      </button>
      <button type="button" class="app-card" id="ctrlLuckyBtn">
        <div class="app-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 3h5v5"></path>
            <path d="M4 20L21 3"></path>
            <path d="M21 16v5h-5"></path>
            <path d="M15 15l6 6"></path>
            <path d="M4 4l5 5"></path>
          </svg>
        </div>
        <div class="app-name">Open Random Site</div>
      </button>
      <button type="button" class="app-card" id="ctrlReloadBtn">
        <div class="app-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"></polyline>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
        </div>
        <div class="app-name">Reload Page</div>
      </button>
      <button type="button" class="app-card" id="ctrlSettingsBtn">
        <div class="app-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="12" cy="12" r="3"></circle>
  <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
</svg>
        </div>
        <div class="app-name">Open Settings</div>
      </button>
      <button type="button" class="app-card shutdown-card" id="ctrlShutdownBtn">
        <div class="app-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
            <line x1="12" y1="2" x2="12" y2="12"></line>
          </svg>
        </div>
        <div class="app-name">Shut Down Session</div>
      </button>
    </div>
  
  </div>

  <div class="drawer" id="appModal">
    <button class="drawer-close" id="appModalClose" aria-label="Close">
      <svg viewBox="0 0 24 24" stroke-width="2" fill="none"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
    <h2>Launcher</h2>
    <div style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 20px;">Apps & Web Services</div>

    <div id="appGridContainer"></div>
  </div>

  <div class="drawer" id="drawer">
    <button class="drawer-close" id="drawerClose" aria-label="Close">
      <svg viewBox="0 0 24 24" stroke-width="2" fill="none"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
    <h2>Settings</h2>
    <div style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 20px;">Preferences & Customization</div>

    <div class="field-group">
      <label>Your Name</label>
      <input type="text" id="setName" placeholder="Ethan">
    </div>

    <div class="field-group">
      <label>Default Search Engine</label>
      <div class="engine-toggle" id="engineSeg">
        <button data-engine="google">Google</button>
        <button data-engine="youtube">YouTube</button>
        <button data-engine="bible_en">Bible</button>
        <button data-engine="url">URL</button>
      </div>
    </div>

    <div class="field-group">
      <label>Homepage Shortcuts</label>
      <div id="shortcutList"></div>
      <form class="add-form" id="addShortcutForm">
        <input type="text" id="newShortLabel" placeholder="Label (e.g. Notion)" required>
        <input type="text" id="newShortUrl" placeholder="URL (https://...)" required>
        <input type="text" id="newShortIcon" placeholder="Emoji or Image URL (e.g. 🧬)">
        <button type="submit" class="add-btn">+ Add Shortcut</button>
      </form>
    </div>

    <div class="field-group">
      <label>Launcher Apps</label>
      <div id="appList" style="margin-bottom: 10px;"></div>
      <form class="add-form" id="addAppForm">
        <input type="text" id="newAppName" placeholder="App Name (e.g. Chess / Steam)" required>
        <input type="text" id="newAppUrl" placeholder="URL (https://...)" required>
        <input type="text" id="newAppIcon" placeholder="Icon Link or Emoji (e.g. 🎮)">
        <select id="newAppCat" class="settings-select" required>
          <option value="games">Games</option>
          <option value="local">Local & Tools</option>
          <option value="google">Google Apps</option>
          <option value="productivity">Productivity</option>
          <option value="ai">AI Tools</option>
          <option value="media">Media & Streaming</option>
        </select>
        <button type="submit" class="add-btn">+ Add Site</button>
      </form>
    </div>

    <div class="field-group">
      <label>Web Reset</label>
      <button type="button" class="reset-btn" id="resetBtn" style="width:100%;">Reset All Settings</button>
    </div>
  </div>

  <script>
    const APPS_CATALOG = [
      { name: "Gmail", cat: "google", icon: "https://cdn.simpleicons.org/gmail/white", url: "https://mail.google.com", desc: "Email" },
      { name: "Drive", cat: "google", icon: "https://cdn.simpleicons.org/googledrive/white", url: "https://drive.google.com", desc: "Cloud Storage" },
      { name: "Classroom", cat: "google", icon: "https://cdn.simpleicons.org/googleclassroom/white", url: "https://classroom.google.com", desc: "School Portal" },
      { name: "Notion", cat: "productivity", icon: "https://cdn.simpleicons.org/notion/white", url: "https://app.notion.com", desc: "Workspace" },
      { name: "GitHub", cat: "productivity", icon: "https://cdn.simpleicons.org/github/white", url: "https://github.com", desc: "Code Repository" },
      { name: "Gemini", cat: "ai", icon: "https://cdn.simpleicons.org/googlegemini/white", url: "https://gemini.google.com", desc: "AI Assistant" },
      { name: "Claude AI", cat: "ai", icon: "https://cdn.simpleicons.org/anthropic/white", url: "https://claude.ai", desc: "AI Assistant" },
      { name: "YouTube", cat: "media", icon: "https://cdn.simpleicons.org/youtube/white", url: "https://www.youtube.com", desc: "Video Streaming" },
      { name: "YT Music", cat: "media", icon: "https://cdn.simpleicons.org/youtubemusic/white", url: "https://music.youtube.com", desc: "Music" },
      { name: "Spotify", cat: "media", icon: "https://cdn.simpleicons.org/spotify/white", url: "https://open.spotify.com", desc: "Music Stream" },
      { name: "VS Code Web", cat: "productivity", icon: "https://cdn.simpleicons.org/gnometerminal/white", url: "https://vscode.dev", desc: "Web Code Editor" },
      { name: "Reddit", cat: "media", icon: "https://cdn.simpleicons.org/reddit/white", url: "https://www.reddit.com", desc: "Community Forum" },
      { name: "iCloud", cat: "productivity", icon: "https://cdn.simpleicons.org/icloud/white", url: "https://www.icloud.com", desc: "Cloud Storage & Services" },
      { name: "Google Translate", cat: "google", icon: "https://cdn.simpleicons.org/googletranslate/white", url: "https://translate.google.com", desc: "Language Translation" },
      { name: "Instagram", cat: "media", icon: "https://cdn.simpleicons.org/instagram/white", url: "https://www.instagram.com", desc: "Social Media" },
      { name: "WhatsApp Web", cat: "productivity", icon: "https://cdn.simpleicons.org/whatsapp/white", url: "https://web.whatsapp.com", desc: "Web Messaging" },
      { name: "Canva", cat: "productivity", icon: "https://cdn.simpleicons.org/chai/white", url: "https://www.canva.com", desc: "Design Tool"  }
    ];

    const CATEGORY_LABELS = {
      games: "Games",
      local: "Local & Tools",
      google: "Google Apps",
      productivity: "Productivity",
      ai: "AI Tools",
      media: "Socials & Streaming"
    };

    const DEFAULTS = {
      name: "Ethan",
      searchEngine: "google",
      shortcuts: [
        { label: "Gmail", url: "https://mail.google.com", icon: "https://cdn.simpleicons.org/gmail/white" },
        { label: "Drive", url: "https://drive.google.com", icon: "https://cdn.simpleicons.org/googledrive/white" },
        { label: "Classroom", url: "https://classroom.google.com", icon: "https://cdn.simpleicons.org/googleclassroom/white" },
        { label: "Notion", url: "https://app.notion.com", icon: "https://cdn.simpleicons.org/notion/white" },
        { label: "YouTube", url: "https://www.youtube.com", icon: "https://cdn.simpleicons.org/youtube/white" },
        { label: "GitHub", url: "https://github.com", icon: "https://cdn.simpleicons.org/github/white" },
      ],
      apps: APPS_CATALOG,
      verses: [
        { ref: "Joshua 1:9", text: "Be strong and courageous. Do not be afraid; for the LORD your God will be with you wherever you go." },
        { ref: "Proverbs 3:5-6", text: "Trust in the LORD with all your heart and lean not on your own understanding." },
        { ref: "Philippians 4:13", text: "I can do all this through him who gives me strength." },
        { ref: "Jeremiah 29:11", text: "For I know the plans I have for you, declares the LORD, plans to prosper you and not to harm you." }
      ]
    };

    const ENGINES = {
      google: { name: "Google", url: "https://www.google.com/search?q=", placeholder: "Search Google…" },
      youtube: { name: "YouTube", url: "https://www.youtube.com/results?search_query=", placeholder: "Search YouTube…" },
      instagram: { name: "Instagram", url: "https://www.instagram.com/explore/tags/", placeholder: "Search Instagram tag…" },
      bible_en: { name: "Bible", url: "https://www.biblegateway.com/passage/?search=", placeholder: "Search Bible… e.g. John 3:16, faith" },
      url: { name: "URL", url: "", placeholder: "Enter web URL… e.g. github.com or https://..." }
    };

    let state = loadSettings();
    if (!state.apps || state.apps.length === 0) {
      state.apps = structuredClone(APPS_CATALOG);
    }

    let isTimeVisible = localStorage.getItem("isTimeVisible") !== "false";
    let isVersionVisible = localStorage.getItem("isVersionVisible") !== "false";

    function loadSettings() {
      try {
        const raw = localStorage.getItem("ethan_home_settings");
        return raw ? Object.assign({}, DEFAULTS, JSON.parse(raw)) : structuredClone(DEFAULTS);
      } catch(e) {
        return structuredClone(DEFAULTS);
      }
    }

    function saveSettings() {
      localStorage.setItem("ethan_home_settings", JSON.stringify(state));
    }

    /* UNIFIED SIDEBAR DRAWER CONTROLS */
    const overlay = document.getElementById("overlay");
    const drawer = document.getElementById("drawer");
    const gearBtn = document.getElementById("gearBtn");
    const drawerClose = document.getElementById("drawerClose");

    const quickControlsModal = document.getElementById("quickControlsModal");
    const quickControlsBtn = document.getElementById("quickControlsBtn");
    const quickControlsClose = document.getElementById("quickControlsClose");

    const appModal = document.getElementById("appModal");
    const appGridBtn = document.getElementById("appGridBtn");
    const appModalClose = document.getElementById("appModalClose");
    const appGridContainer = document.getElementById("appGridContainer");

    function closeAllDrawers() {
      overlay.classList.remove("open");
      drawer.classList.remove("open");
      quickControlsModal.classList.remove("open");
      appModal.classList.remove("open");
    }

    gearBtn.addEventListener("click", () => {
      syncSettingsUI();
      closeAllDrawers();
      overlay.classList.add("open");
      drawer.classList.add("open");
    });

    quickControlsBtn.addEventListener("click", () => {
      closeAllDrawers();
      overlay.classList.add("open");
      quickControlsModal.classList.add("open");
    });

    appGridBtn.addEventListener("click", () => {
      renderAppGrid();
      closeAllDrawers();
      overlay.classList.add("open");
      appModal.classList.add("open");
    });

    drawerClose.addEventListener("click", closeAllDrawers);
    quickControlsClose.addEventListener("click", closeAllDrawers);
    appModalClose.addEventListener("click", closeAllDrawers);
    overlay.addEventListener("click", closeAllDrawers);

    /* PIN LOCK LOGIC */
    const CORRECT_PIN = "2508";
    const pinOverlay = document.getElementById("pinOverlay");
    const pinInput = document.getElementById("pinInput");
    const pinError = document.getElementById("pinError");
    const pinCard = document.getElementById("pinCard");
    const pinDateTime = document.getElementById("pinDateTime");

    function checkUnlock() {
      if (sessionStorage.getItem("isUnlocked") === "true") {
        pinOverlay.classList.add("hidden");
        pinDateTime.style.display = "none";
      } else {
        pinOverlay.classList.remove("hidden");
        if (isTimeVisible) pinDateTime.style.display = "block";
        setTimeout(() => pinInput.focus(), 100);
      }
    }

    pinInput.addEventListener("input", () => {
      pinError.textContent = "";
      if (pinInput.value.length === 4) {
        if (pinInput.value === CORRECT_PIN) {
          sessionStorage.setItem("isUnlocked", "true");
          checkUnlock();
          pinInput.value = "";
        } else {
          pinError.textContent = "Incorrect PIN code!";
          pinInput.value = "";
        }
      }
    });

    document.getElementById("pinRefreshBtn").addEventListener("click", () => location.reload());
    document.getElementById("pinCloseBtn").addEventListener("click", () => location.href = "about:blank");

    function lockScreen() {
      sessionStorage.removeItem("isUnlocked");
      closeAllDrawers();
      pinInput.value = "";
      pinError.textContent = "";
      checkUnlock();
    }

    document.getElementById("ctrlLockBtn").addEventListener("click", lockScreen);
    document.getElementById("ctrlReloadBtn").addEventListener("click", () => location.reload());
    document.getElementById("ctrlShutdownBtn").addEventListener("click", () => location.href = "about:blank");
    document.getElementById("ctrlFullscreenBtn").addEventListener("click", () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    });
    document.getElementById("ctrlLuckyBtn").addEventListener("click", () => {
      const rand = state.shortcuts[Math.floor(Math.random() * state.shortcuts.length)];
      if (rand && rand.url) window.open(rand.url, "_blank");
    });
    document.getElementById("ctrlSettingsBtn").addEventListener("click", () => {
      syncSettingsUI();
      closeAllDrawers();
      overlay.classList.add("open");
      drawer.classList.add("open");
    });

    /* TIME & DATE */
    function updateClock() {
      const now = new Date();
      let hrs = String(now.getHours()).padStart(2, '0');
      let mins = String(now.getMinutes()).padStart(2, '0');
      let secs = String(now.getSeconds()).padStart(2, '0');

      document.getElementById("clock").childNodes[0].nodeValue = `${hrs}:${mins}`;
      document.getElementById("clockSec").textContent = `:${secs}`;

      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      const dateStr = now.toLocaleDateString('en-US', options);
      document.getElementById("dateLine").textContent = dateStr;

      const timeStrStr = `${hrs}:${mins}:${secs}`;
      pinDateTime.innerHTML = `${timeStrStr}<br><span style="font-size:0.75em; opacity:0.8;">${dateStr}</span>`;

      const hour = now.getHours();
      let g = "Hello";
      if (hour < 12) g = "Good Morning";
      else if (hour < 18) g = "Good Afternoon";
      else g = "Good Evening";
      document.getElementById("greeting").textContent = `${g}, ${state.name || 'Ethan'}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    /* SEARCH ENGINES & GO TO URL */
    let currentEngine = state.searchEngine || "google";
    function setEngine(engineKey) {
      if (!ENGINES[engineKey]) engineKey = "google";
      currentEngine = engineKey;
      state.searchEngine = engineKey;
      saveSettings();

      const conf = ENGINES[engineKey];
      document.getElementById("searchInput").placeholder = conf.placeholder;

      document.querySelectorAll("#engineToggle button, #engineSeg button").forEach(b => {
        b.classList.toggle("active", b.dataset.engine === engineKey);
      });
    }

    document.querySelectorAll("#engineToggle button").forEach(btn => {
      btn.addEventListener("click", () => setEngine(btn.dataset.engine));
    });

    document.getElementById("searchForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const q = document.getElementById("searchInput").value.trim();
      if (!q) return;

      if (currentEngine === "url") {
        let target = q;
        if (!/^https?:\/\//i.test(target) && !/^file:\/\/\//i.test(target)) {
          target = "https://" + target;
        }
        window.open(target, "_blank");
      } else {
        window.open(ENGINES[currentEngine].url + encodeURIComponent(q), "_blank");
      }
      document.getElementById("searchInput").value = "";
    });

    /* APP LAUNCHER MANAGER */
    function renderAppGrid() {
      appGridContainer.innerHTML = "";
      const appsList = state.apps || APPS_CATALOG;

      const categories = {};
      appsList.forEach(app => {
        const cat = app.cat || "other";
        if (!categories[cat]) categories[cat] = [];
        categories[cat].push(app);
      });

      Object.keys(categories).forEach(catKey => {
        const groupDiv = document.createElement("div");
        groupDiv.className = "field-group";

        const label = document.createElement("label");
        label.textContent = CATEGORY_LABELS[catKey] || catKey.toUpperCase();
        groupDiv.appendChild(label);

        const gridDiv = document.createElement("div");
        gridDiv.className = "app-grid-container";

        categories[catKey].forEach(app => {
          const card = document.createElement("a");
          card.className = "app-card";
          card.href = app.url;
          card.target = "_blank";

          const iconDiv = document.createElement("div");
          iconDiv.className = "app-icon";
          if (app.icon && (app.icon.startsWith("http") || app.icon.startsWith("data:"))) {
            const img = document.createElement("img");
            img.src = app.icon;
            img.alt = app.name;
            iconDiv.appendChild(img);
          } else {
            iconDiv.textContent = app.icon || app.name.charAt(0);
          }

          const nameDiv = document.createElement("div");
          nameDiv.className = "app-name";
          nameDiv.textContent = app.name;

          card.appendChild(iconDiv);
          card.appendChild(nameDiv);
          gridDiv.appendChild(card);
        });

        groupDiv.appendChild(gridDiv);
        appGridContainer.appendChild(groupDiv);
      });
    }

    /* SHORTCUTS */
    function renderShortcuts() {
      const container = document.getElementById("shortcuts");
      container.innerHTML = "";
      state.shortcuts.forEach(s => {
        const a = document.createElement("a");
        a.className = "shortcut";
        a.href = s.url;
        a.target = "_blank";

        const iconDiv = document.createElement("div");
        iconDiv.className = "icon";
        if (s.icon && (s.icon.startsWith("http") || s.icon.startsWith("data:"))) {
          const img = document.createElement("img");
          img.src = s.icon;
          img.alt = s.label;
          iconDiv.appendChild(img);
        } else {
          iconDiv.textContent = s.icon || s.label.charAt(0);
        }

        const labelSpan = document.createElement("span");
        labelSpan.textContent = s.label;

        a.appendChild(iconDiv);
        a.appendChild(labelSpan);
        container.appendChild(a);
      });
    }

    function renderVerse() {
      if (!state.verses || state.verses.length === 0) return;
      const v = state.verses[Math.floor(Math.random() * state.verses.length)];
      const msgEl = document.getElementById("message");
      msgEl.style.opacity = 0;
      setTimeout(() => {
        msgEl.textContent = `"${v.text}" — ${v.ref}`;
        msgEl.style.opacity = 1;
      }, 300);
    }

    /* SETTINGS CONTROLS */
    document.getElementById("setName").addEventListener("input", (e) => {
      state.name = e.target.value.trim();
      saveSettings();
      updateClock();
    });

    document.querySelectorAll("#engineSeg button").forEach(b => {
      b.addEventListener("click", () => {
        setEngine(b.dataset.engine);
        syncSettingsUI();
      });
    });

    function renderShortcutManager() {
      const list = document.getElementById("shortcutList");
      list.innerHTML = "";
      state.shortcuts.forEach((s, idx) => {
        const row = document.createElement("div");
        row.className = "list-row";
        row.innerHTML = `
          <div class="row-text">
            <strong>${s.label}</strong>
            <div style="font-size:11px; opacity:0.7;">${s.url}</div>
          </div>
          <button class="drawer-close" onclick="removeShortcut(${idx})">✕</button>
        `;
        list.appendChild(row);
      });
    }

    window.removeShortcut = function(idx) {
      state.shortcuts.splice(idx, 1);
      saveSettings();
      renderShortcutManager();
      renderShortcuts();
    };

    document.getElementById("addShortcutForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const label = document.getElementById("newShortLabel").value.trim();
      const url = document.getElementById("newShortUrl").value.trim();
      const icon = document.getElementById("newShortIcon").value.trim();

      if (!label || !url) return;
      state.shortcuts.push({ label, url, icon: icon || label.charAt(0) });
      saveSettings();

      document.getElementById("newShortLabel").value = "";
      document.getElementById("newShortUrl").value = "";
      document.getElementById("newShortIcon").value = "";

      renderShortcutManager();
      renderShortcuts();
    });

    function renderAppManager() {
      const list = document.getElementById("appList");
      if (!list) return;
      list.innerHTML = "";
      (state.apps || []).forEach((app, idx) => {
        const row = document.createElement("div");
        row.className = "list-row";
        row.innerHTML = `
          <div class="row-text">
            <strong>${app.name}</strong> <span style="font-size:10px; opacity:0.6;">(${app.cat})</span>
            <div style="font-size:11px; opacity:0.7;">${app.url}</div>
          </div>
          <button class="drawer-close" onclick="removeApp(${idx})">✕</button>
        `;
        list.appendChild(row);
      });
    }

    window.removeApp = function(idx) {
      state.apps.splice(idx, 1);
      saveSettings();
      renderAppManager();
      renderAppGrid();
    };

    document.getElementById("addAppForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const name = document.getElementById("newAppName").value.trim();
      const url = document.getElementById("newAppUrl").value.trim();
      const icon = document.getElementById("newAppIcon").value.trim();
      const cat = document.getElementById("newAppCat").value;

      if (!name || !url) return;
      
      if (!state.apps) state.apps = [];
      state.apps.push({ name, url, icon: icon || name.charAt(0), cat, desc: "User App" });
      saveSettings();

      document.getElementById("newAppName").value = "";
      document.getElementById("newAppUrl").value = "";
      document.getElementById("newAppIcon").value = "";

      renderAppManager();
      renderAppGrid();
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      if (confirm("Reset all settings to default?")) {
        state = structuredClone(DEFAULTS);
        saveSettings();
        setEngine(state.searchEngine);
        renderShortcuts();
        renderVerse();
        syncSettingsUI();
        updateClock();
        renderAppGrid();
      }
    });

    function syncSettingsUI() {
      document.getElementById("setName").value = state.name || "";
      document.querySelectorAll("#engineSeg button").forEach(b => b.classList.toggle("active", b.dataset.engine === state.searchEngine));
      renderShortcutManager();
      renderAppManager();
    }

    // INITIALIZATION
    checkUnlock();
    setEngine(state.searchEngine);
    renderShortcuts();
    renderVerse();
    document.getElementById("versionTag").style.display = isVersionVisible ? "flex" : "none";
  </script>
</body>
</html>
