<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Periodic Table Studio | Ethan's Home Menu</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚛️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    :root {
      --card-bg: rgba(18, 24, 33, 0.85);
      --card-border: rgba(255, 255, 255, 0.12);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #dd9c47;
      --glass-blur: 12px;
    }

    /* Strictly Unscrollable Single-Screen Viewport */
    html, body {
      height: 100%;
      max-height: 100vh;
      overflow: hidden !important;
      margin: 0;
      padding: 0;
      background-color: #0f172a;
      color: var(--text);
      font-family: 'Manrope', sans-serif;
    }

    .chem-workspace {
      width: 100%;
      max-width: 1500px;
      margin: 64px auto 0 auto;
      height: calc(100vh - 72px);
      padding: 0 16px 12px 16px;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }

    /* Main Container Card */
    .table-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 10px 16px;
      backdrop-filter: blur(var(--glass-blur));
      display: flex;
      flex-direction: column;
      gap: 5px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
      flex: 1;
      height: 100%;
      box-sizing: border-box;
      overflow: hidden;
    }

    .toolbar-bar {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .search-box {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 6px 12px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.8rem;
      outline: none;
      width: 200px;
      transition: all 0.2s ease;
    }

    .search-box:focus {
      border-color: var(--accent);
      box-shadow: 0 0 10px rgba(221, 156, 71, 0.25);
    }

    /* Category Filter Badges */
    .filter-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      justify-content: flex-end;
    }

    .cat-pill {
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      padding: 3px 6px;
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
    }

    .cat-pill:hover, .cat-pill.active {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.4);
      transform: translateY(-1px);
    }

    /* 18-Column Optimized Flexible Grid */
    .ptable-grid {
      display: grid;
      grid-template-columns: repeat(18, 1fr);
      grid-template-rows: repeat(10, 1fr);
      gap: 3px;
      flex: 1;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
    }

    .elem-tile {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      padding: 2px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.15s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      user-select: none;
      min-height: 0;
    }

    .elem-tile:hover {
      transform: scale(1.15);
      z-index: 10;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
      border-color: #fff !important;
    }

    .elem-tile.dimmed {
      opacity: 0.15;
      filter: grayscale(80%);
    }

    .tile-z {
      font-size: 0.55rem;
      font-weight: 700;
      opacity: 0.8;
      line-height: 1;
    }

    .tile-sym {
      font-size: 0.85rem;
      font-weight: 800;
      text-align: center;
      line-height: 1;
    }

    .tile-name {
      font-size: 0.48rem;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      opacity: 0.85;
      line-height: 1;
    }

    /* Category Specific Tile Styling */
    .cat-alkali       { background: rgba(239, 68, 68, 0.2); border-color: rgba(239, 68, 68, 0.4); color: #fca5a5; }
    .cat-alkaline     { background: rgba(249, 115, 22, 0.2); border-color: rgba(249, 115, 22, 0.4); color: #fdba74; }
    .cat-transition   { background: rgba(234, 179, 8, 0.2); border-color: rgba(234, 179, 8, 0.4); color: #fde047; }
    .cat-posttrans    { background: rgba(16, 185, 129, 0.2); border-color: rgba(16, 185, 129, 0.4); color: #6ee7b7; }
    .cat-metalloid    { background: rgba(6, 182, 212, 0.25); border-color: rgba(6, 182, 212, 0.5); color: #67e8f9; }    .cat-nonmetal     { background: rgba(59, 130, 246, 0.2); border-color: rgba(59, 130, 246, 0.4); color: #93c5fd; }
    .cat-halogen      { background: rgba(168, 85, 247, 0.2); border-color: rgba(168, 85, 247, 0.4); color: #c084fc; }
    .cat-noblegas     { background: rgba(236, 72, 153, 0.2); border-color: rgba(236, 72, 153, 0.4); color: #f472b6; }
    .cat-lanthanide   { background: rgba(244, 114, 182, 0.2); border-color: rgba(244, 114, 182, 0.4); color: #fbcfe8; }
    .cat-actinide     { background: rgba(251, 113, 133, 0.2); border-color: rgba(251, 113, 133, 0.4); color: #fecdd3; }
    .cat-unknown      { background: rgba(100, 116, 139, 0.2); border-color: rgba(100, 116, 139, 0.4); color: #cbd5e1; }

    .series-label {
      grid-column: span 2;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 6px;
      font-size: 0.6rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    /* Centered Modal Overlay & Card */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: rgba(18, 24, 33, 0.95);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 24px;
      width: 90%;
      max-width: 440px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
      transform: scale(0.92);
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-overlay.open .modal-card {
      transform: scale(1);
    }

    .modal-close-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--card-border);
      color: var(--text);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .modal-close-btn:hover {
      background: rgba(239, 68, 68, 0.3);
      border-color: #ef4444;
      color: #fff;
    }

    .inspector-header {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .giant-badge {
      width: 76px;
      height: 76px;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--card-border);
      background: rgba(0,0,0,0.3);
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.5);
      flex-shrink: 0;
    }

    .giant-badge .z { font-size: 0.75rem; font-weight: 800; opacity: 0.8; }
    .giant-badge .sym { font-size: 2rem; font-weight: 800; line-height: 1; }

    .inspector-title h2 {
      font-family: 'Fraunces', serif;
      font-size: 1.6rem;
      margin: 0;
      font-weight: 500;
    }

    .cat-badge-pill {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 0.72rem;
      font-weight: 800;
      margin-top: 4px;
      text-transform: capitalize;
    }

    .prop-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 12px;
    }

    .prop-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .prop-item.full-width {
      grid-column: span 2;
    }

    .prop-label {
      font-size: 0.65rem;
      color: var(--text-muted);
      font-weight: 700;
      text-transform: uppercase;
    }

    .prop-val {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text);
    }

    .fun-fact-box {
      background: rgba(221, 156, 71, 0.1);
      border: 1px solid rgba(221, 156, 71, 0.3);
      border-radius: 14px;
      padding: 12px;
      font-size: 0.82rem;
      line-height: 1.45;
      color: var(--text);
    }
    /* Modal Navigation Buttons */
    .modal-nav-btns {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 4px;
    }

    .nav-btn {
      flex: 1;
      padding: 8px 14px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.4);
      transform: translateY(-1px);
    }

    .nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="version-tag" id="versionTag">Ethan's Chemistry Lab</div>
    <div class="header-btns">
    <a href="index.html" style="text-decoration: none;">
      <button class="icon-btn-circle" title="Home Menu" aria-label="Home Menu">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
      </button>
    </a>
    </div>
  <div class="chem-workspace">
    <div class="table-card">
      <div class="toolbar-bar">
        <input type="text" id="searchInput" class="search-box" placeholder="🔍 Search element or symbol:">
        <div class="filter-pills" id="filterPills"></div>
      </div>

      <div class="ptable-grid" id="ptableGrid"></div>
    </div>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
      <button class="modal-close-btn" id="modalCloseBtn">✕</button>
      
      <div class="inspector-header">
        <div class="giant-badge cat-nonmetal" id="insBadge">
          <span class="z" id="insZ">1</span>
          <span class="sym" id="insSym">H</span>
        </div>
        <div class="inspector-title">
          <h2 id="insName">Hydrogen</h2>
          <span class="cat-badge-pill cat-nonmetal" id="insCat">Reactive Nonmetal</span>
        </div>
      </div>

      <div class="prop-grid">
        <div class="prop-item">
          <span class="prop-label">Group / Family</span>
          <span class="prop-val" id="insGroup">Group 1</span>
        </div>
        <div class="prop-item">
          <span class="prop-label">Period</span>
          <span class="prop-val" id="insPeriod">1</span>
        </div>
        <div class="prop-item">
          <span class="prop-label">Atomic Mass</span>
          <span class="prop-val" id="insMass">1.008 u</span>
        </div>
        <div class="prop-item">
          <span class="prop-label">Room Temp State</span>
          <span class="prop-val" id="insState">Gas 💨</span>
        </div>
        <div class="prop-item">
          <span class="prop-label">Electron Configuration</span>
          <span class="prop-val" id="insConfig">1s¹</span>
        </div>
         <div class="prop-item">
          <span class="prop-label">Valence Electrons</span>
          <span class="prop-val" id="insValence">1</span>
        </div>
         <div class="prop-item">
          <span class="prop-label">Discovered</span>
          <span class="prop-val" id="insYear">1766</span>
        </div>
      </div>

      <div class="fun-fact-box" id="insSummary">
        Most abundant chemical element in the universe, making up 75% of all matter!
      </div>

      <div class="modal-nav-btns">
        <button class="nav-btn" id="prevElemBtn">Previous</button>
        <button class="nav-btn" id="nextElemBtn">Next</button>
      </div>
    </div>
  </div>

      { z: 113, sym: 'Nh', name: 'Nihonium', mass: '286', cat: 'unknown', r: 7, c: 13, state: 'Synthetic 🧪', year: '2004', cfg: '[Rn] 5f¹⁴ 6d¹⁰ 7s² 7p¹', summary: 'First element discovered in Asia; named after "Nihon", the Japanese word for Japan.' },
      { z: 114, sym: 'Fl', name: 'Flerovium', mass: '289', cat: 'unknown', r: 7, c: 14, state: 'Synthetic 🧪', year: '1998', cfg: '[Rn] 5f¹⁴ 6d¹⁰ 7s² 7p²', summary: 'Superheavy element named after Flerov Laboratory of Nuclear Reactions.' },
      { z: 115, sym: 'Mc', name: 'Moscovium', mass: '290', cat: 'unknown', r: 7, c: 15, state: 'Synthetic 🧪', year: '2003', cfg: '[Rn] 5f¹⁴ 6d¹⁰ 7s² 7p³', summary: 'Superheavy element named in honor of the Moscow region in Russia.' },
      { z: 116, sym: 'Lv', name: 'Livermorium', mass: '293', cat: 'unknown', r: 7, c: 16, state: 'Synthetic 🧪', year: '2000', cfg: '[Rn] 5f¹⁴ 6d¹⁰ 7s² 7p⁴', summary: 'Named after Lawrence Livermore National Laboratory in California.' },
      { z: 117, sym: 'Ts', name: 'Tennessine', mass: '294', cat: 'unknown', r: 7, c: 17, state: 'Synthetic 🧪', year: '2010', cfg: '[Rn] 5f¹⁴ 6d¹⁰ 7s² 7p⁵', summary: 'Superheavy halogen element named after the US state of Tennessee.' },
      { z: 118, sym: 'Og', name: 'Oganesson', mass: '294', cat: 'unknown', r: 7, c: 18, state: 'Synthetic 🧪', year: '2002', cfg: '[Rn] 5f¹⁴ 6d¹⁰ 7s² 7p⁶', summary: 'Heaviest element on the periodic table! Man-made in particle accelerators.' }
    ];

    /* Render Category Filters */
    const filterContainer = document.getElementById('filterPills');
    let activeCategory = 'all';

    const allPill = document.createElement('div');
    allPill.className = 'cat-pill active';
    allPill.textContent = 'All Elements';
    allPill.onclick = () => filterCategory('all', allPill);
    filterContainer.appendChild(allPill);

    Object.keys(CATEGORIES).forEach(key => {
      const pill = document.createElement('div');
      pill.className = 'cat-pill';
      pill.textContent = CATEGORIES[key].name;
      pill.onclick = () => filterCategory(key, pill);
      filterContainer.appendChild(pill);
    });

    function filterCategory(catKey, targetPill) {
      activeCategory = catKey;
      document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active'));
      targetPill.classList.add('active');
      applyFilters();
    }

    /* Render Periodic Table Grid */
    const gridEl = document.getElementById('ptableGrid');

    function renderGrid() {
      gridEl.innerHTML = '';

      // Series Markers
      const lntLabel = document.createElement('div');
      lntLabel.className = 'series-label';
      lntLabel.style.gridRow = '9';
      lntLabel.style.gridColumn = '1 / span 3';
      lntLabel.textContent = 'Lanthanides ➔';
      gridEl.appendChild(lntLabel);

      const actLabel = document.createElement('div');
      actLabel.className = 'series-label';
      actLabel.style.gridRow = '10';
      actLabel.style.gridColumn = '1 / span 3';
      actLabel.textContent = 'Actinides ➔';
      gridEl.appendChild(actLabel);

      ELEMENTS.forEach(elem => {
        const tile = document.createElement('div');
        const catInfo = CATEGORIES[elem.cat] || CATEGORIES.unknown;
        tile.className = `elem-tile ${catInfo.css}`;
        tile.style.gridRow = elem.r;
        tile.style.gridColumn = elem.c;
        tile.dataset.z = elem.z;

        tile.innerHTML = `
          <div class="tile-z">${elem.z}</div>
          <div class="tile-sym">${elem.sym}</div>
          <div class="tile-name">${elem.name}</div>
        `;

        tile.onclick = () => openModal(elem);
        gridEl.appendChild(tile);
      });
    }

    /* Modal Popup Trigger & Navigation */
    const modalOverlay = document.getElementById('modalOverlay');
    const modalCloseBtn = document.getElementById('modalCloseBtn');
    const prevElemBtn = document.getElementById('prevElemBtn');
    const nextElemBtn = document.getElementById('nextElemBtn');
    let currentElemIndex = -1;

function openModal(elem) {
      currentElemIndex = ELEMENTS.findIndex(e => e.z === elem.z);
      const catInfo = CATEGORIES[elem.cat] || CATEGORIES.unknown;

      document.getElementById('insBadge').className = `giant-badge ${catInfo.css}`;
      document.getElementById('insZ').textContent = elem.z;
      document.getElementById('insSym').textContent = elem.sym;
      document.getElementById('insName').textContent = elem.name;

      const catBadge = document.getElementById('insCat');
      catBadge.className = `cat-badge-pill ${catInfo.css}`;
      catBadge.textContent = catInfo.name;

      // Calculate Golongan (A/B), Period, & Valence Electrons
      let groupText = `Group ${GOLONGAN_MAP[elem.c] || elem.c}`;
      let periodText = elem.r;

      if (elem.cat === 'lanthanide') {
        groupText = 'Group 3B (f-block)';
        periodText = 6;
      } else if (elem.cat === 'actinide') {
        groupText = 'Group 3B (f-block)';
        periodText = 7;
      }

      let valenceText = '2';
      if (elem.z === 2) {
        valenceText = '2'; // Helium
      } else if (elem.c === 1) {
        valenceText = '1';
      } else if (elem.c === 2) {
        valenceText = '2';
      } else if (elem.c >= 13 && elem.c <= 18) {
        valenceText = `${elem.c - 10}`;
      } else {
        valenceText = elem.cfg.includes('s¹') ? '1' : '2';
      }

      document.getElementById('insGroup').textContent = groupText;
      document.getElementById('insPeriod').textContent = periodText;
      document.getElementById('insValence').textContent = valenceText;
      document.getElementById('insMass').textContent = `${elem.mass} u`;
      document.getElementById('insState').textContent = elem.state;
      document.getElementById('insYear').textContent = elem.year;
      document.getElementById('insConfig').textContent = elem.cfg;
      document.getElementById('insSummary').textContent = elem.summary;

      // Navigation Buttons State
      if (prevElemBtn && nextElemBtn) {
        prevElemBtn.disabled = currentElemIndex <= 0;
        nextElemBtn.disabled = currentElemIndex >= ELEMENTS.length - 1;
      }

      modalOverlay.classList.add('open');
    }

    /* Prev / Next Button Handlers */
    prevElemBtn.addEventListener('click', () => {
      if (currentElemIndex > 0) {
        openModal(ELEMENTS[currentElemIndex - 1]);
      }
    });

    nextElemBtn.addEventListener('click', () => {
      if (currentElemIndex < ELEMENTS.length - 1) {
        openModal(ELEMENTS[currentElemIndex + 1]);
      }
    });

    function closeModal() {
      modalOverlay.classList.remove('open');
    }

    modalCloseBtn.addEventListener('click', closeModal);
    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) closeModal();
    });

    /* Keyboard Navigation (Escape to close, Arrow keys to navigate) */
    window.addEventListener('keydown', (e) => {
      if (!modalOverlay.classList.contains('open')) return;

      if (e.key === 'Escape') {
        closeModal();
      } else if (e.key === 'ArrowLeft' && currentElemIndex > 0) {
        openModal(ELEMENTS[currentElemIndex - 1]);
      } else if (e.key === 'ArrowRight' && currentElemIndex < ELEMENTS.length - 1) {
        openModal(ELEMENTS[currentElemIndex + 1]);
      }
    });

    /* Search & Category Filter Logic */
    const searchInput = document.getElementById('searchInput');
    searchInput.addEventListener('input', applyFilters);

    function applyFilters() {
      const query = searchInput.value.toLowerCase().trim();

      document.querySelectorAll('.elem-tile').forEach(tile => {
        const z = parseInt(tile.dataset.z);
        const elem = ELEMENTS.find(e => e.z === z);
        if (!elem) return;

        const matchesCat = (activeCategory === 'all' || elem.cat === activeCategory);
        const matchesQuery = !query || 
          elem.name.toLowerCase().includes(query) || 
          elem.sym.toLowerCase().includes(query) || 
          elem.z.toString() === query;

        if (matchesCat && matchesQuery) {
          tile.classList.remove('dimmed');
        } else {
          tile.classList.add('dimmed');
        }
      });
    }

    // Initialize Grid
    renderGrid();
  </script>
</body>
</html>
