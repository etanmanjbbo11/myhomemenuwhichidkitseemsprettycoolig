<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Clocks | Ethan's Home Menu</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌐</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Custom Layout & Card Styling for World Clocks */
    .clock-container {
      width: 100%;
      max-width: 1100px;
      margin: 80px auto 40px auto;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .clock-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }

    .clock-title h1 {
      font-family: 'Fraunces', serif;
      font-size: 2.2rem;
      font-weight: 500;
      letter-spacing: -0.5px;
      margin-top: 4px;
    }

    /* Hero Local Time Card */
    .local-hero-card {
      background: linear-gradient(135deg, rgba(221, 156, 71, 0.12) 0%, rgba(20, 26, 32, 0.8) 100%);
      border: 1px solid rgba(221, 156, 71, 0.3);
      border-radius: 24px;
      padding: 28px;
      backdrop-filter: blur(var(--glass-blur));
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 20px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
    }

    .local-info {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .local-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(221, 156, 71, 0.2);
      color: var(--accent);
      border: 1px solid rgba(221, 156, 71, 0.3);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      width: fit-content;
    }

    .local-time-display {
      font-family: 'Fraunces', serif;
      font-size: 3.5rem;
      font-weight: 400;
      line-height: 1;
      letter-spacing: -1px;
      color: var(--text);
    }

    .local-date-display {
      font-size: 1rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Controls Bar */
    .controls-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .btn-secondary {
      background: var(--btn-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-secondary:hover {
      background: var(--btn-hover);
      border-color: var(--accent);
    }

    .btn-accent {
      background: var(--accent);
      border: 1px solid var(--accent);
      color: #10151a;
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-accent:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
      transform: translateY(-1px);
    }

    /* Grid of Cities */
    .clocks-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    .city-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 22px;
      backdrop-filter: blur(var(--glass-blur));
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 16px;
      position: relative;
      transition: all 0.2s ease;
    }

    .city-card:hover {
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
    }

    .city-card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }

    .city-name {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.2;
    }

    .city-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .day-night-tag {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 12px;
    }

    .tag-day {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .tag-night {
      background: rgba(99, 102, 241, 0.15);
      color: #818cf8;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }

    .city-time {
      font-family: 'Fraunces', serif;
      font-size: 2.5rem;
      font-weight: 400;
      line-height: 1;
      color: var(--text);
    }

    .city-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--card-border);
      padding-top: 12px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .remove-city-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      transition: color 0.2s ease;
    }

    .remove-city-btn:hover {
      color: #f87171;
    }

    /* Modal Styling */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(var(--glass-blur));
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #12161c;
      border: 1px solid var(--card-border);
      border-radius: 20px;
      width: 100%;
      max-width: 480px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .modal-header h3 {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .modal-search {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
      margin-bottom: 14px;
    }

    .modal-search:focus {
      border-color: var(--accent);
    }

    .tz-list {
      max-height: 260px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 4px;
    }

    .tz-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: var(--btn-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tz-item:hover {
      background: var(--btn-hover);
      border-color: var(--accent);
    }

    .tz-item-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
    }

    .tz-item-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="version-tag" id="versionTag">Ethan's World Clocks</div>

  <div class="header-btns">
    <a href="index.html" style="text-decoration: none;">
      <button class="icon-btn-circle" title="Home Menu" aria-label="Home Menu">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
      </button>
    </a>
    <a href="calendar.html" style="text-decoration: none;">
      <button class="icon-btn-circle" title="Calendar" aria-label="Calendar">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
      </button>
    </a>
    <a href="todolist.html" style="text-decoration: none;">
      <button class="icon-btn-circle" title="To-Do List" aria-label="To-Do List">
        <svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke="currentColor">
          <polyline points="9 11 12 14 22 4"></polyline>
          <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
        </svg>
      </button>
    </a>
  </div>

  <div class="clock-container">
    <div class="clock-header">
      <div class="clock-title">
        <div class="eyebrow"><span class="dot"></span>Timezone Monitor</div>
        <h1>World Clocks</h1>
      </div>
      <div class="controls-bar">
        <button class="btn-secondary" id="toggleFormatBtn">Format: 24-Hour</button>
        <button class="btn-accent" id="addCityBtn">+ Add City</button>
      </div>
    </div>

    <div class="local-hero-card">
      <div class="local-info">
        <div class="local-badge">📍 Local Time</div>
        <div class="local-time-display" id="localTime">00:00:00</div>
        <div class="local-date-display" id="localDate">Loading date...</div>
      </div>
      <div id="localTzInfo" style="text-align: right; color: var(--text-muted); font-size: 0.9rem;">
        <div id="localTzName" style="font-size: 1.1rem; font-weight: 700; color: var(--text);">Primary Location</div>
        <div id="localTzOffset">UTC Offset</div>
      </div>
    </div>

    <div class="clocks-grid" id="clocksGrid">
      </div>
  </div>

  <div class="modal" id="addCityModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Add World City</h3>
        <button class="remove-city-btn" id="closeModalBtn" style="font-size: 1.2rem;">✕</button>
      </div>
      <input type="text" class="modal-search" id="citySearchInput" placeholder="Search city or country (e.g. London, California)...">
      <div class="tz-list" id="tzList">
        </div>
    </div>
  </div>

  <script>
    /* Security Check / Authorization */
    function checkUnlock() {
      if (sessionStorage.getItem("isUnlocked") !== "true") {
        window.location.href = "index.html";
      }
    }
    checkUnlock();

    /* City Database */
    const CITY_DATABASE = [
      { name: "California", country: "United States (PST)", tz: "America/Los_Angeles" },
      { name: "Tokyo", country: "Japan", tz: "Asia/Tokyo" },
      { name: "Singapore", country: "Singapore", tz: "Asia/Singapore" },
      { name: "Sydney", country: "Australia", tz: "Australia/Sydney" },
      { name: "London", country: "United Kingdom", tz: "Europe/London" },
      { name: "New York", country: "United States (EST)", tz: "America/New_York" },
      { name: "Paris", country: "France", tz: "Europe/Paris" },
      { name: "Dubai", country: "United Arab Emirates", tz: "Asia/Dubai" },
      { name: "Hong Kong", country: "China", tz: "Asia/Hong_Kong" },
      { name: "Berlin", country: "Germany", tz: "Europe/Berlin" },
      { name: "Jakarta", country: "Indonesia", tz: "Asia/Jakarta" },
      { name: "Seoul", country: "South Korea", tz: "Asia/Seoul" },
      { name: "Toronto", country: "Canada", tz: "America/Toronto" },
      { name: "Cairo", country: "Egypt", tz: "Africa/Cairo" },
      { name: "Mumbai", country: "India", tz: "Asia/Kolkata" },
      { name: "Istanbul", country: "Turkey", tz: "Europe/Istanbul" },
      { name: "Auckland", country: "New Zealand", tz: "Pacific/Auckland" },
      { name: "Bangkok", country: "Thailand", tz: "Asia/Bangkok" },
      { name: "Rio de Janeiro", country: "Brazil", tz: "America/Sao_Paulo" },
      { name: "Zurich", country: "Switzerland", tz: "Europe/Zurich" }
    ];

    /* Default Selected Cities */
    const DEFAULT_CITIES = [
      "America/Los_Angeles",
      "Asia/Tokyo",
      "Asia/Singapore",
      "Australia/Sydney"
    ];

    /* State Initialization: Default to 24-Hour mode */
    const stored24 = localStorage.getItem("ethan_clock_24h");
    let is24Hour = stored24 !== null ? stored24 === "true" : true;
    let activeTimezones = JSON.parse(localStorage.getItem("ethan_world_cities") || JSON.stringify(DEFAULT_CITIES));

    /* Elements */
    const localTimeEl = document.getElementById("localTime");
    const localDateEl = document.getElementById("localDate");
    const localTzNameEl = document.getElementById("localTzName");
    const localTzOffsetEl = document.getElementById("localTzOffset");
    const clocksGrid = document.getElementById("clocksGrid");
    const toggleFormatBtn = document.getElementById("toggleFormatBtn");
    const addCityBtn = document.getElementById("addCityBtn");
    const addCityModal = document.getElementById("addCityModal");
    const closeModalBtn = document.getElementById("closeModalBtn");
    const citySearchInput = document.getElementById("citySearchInput");
    const tzList = document.getElementById("tzList");

    /* Format Toggle Handler */
    toggleFormatBtn.textContent = `Format: ${is24Hour ? '24-Hour' : '12-Hour'}`;
    toggleFormatBtn.addEventListener("click", () => {
      is24Hour = !is24Hour;
      localStorage.setItem("ethan_clock_24h", is24Hour);
      toggleFormatBtn.textContent = `Format: ${is24Hour ? '24-Hour' : '12-Hour'}`;
      updateClocks();
    });

    /* Update All Clocks */
    function updateClocks() {
      const now = new Date();

      // 1. Update Primary Local Clock
      const localTimeStr = now.toLocaleTimeString('en-US', {
        hour12: !is24Hour,
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });
      const localDateStr = now.toLocaleDateString('en-US', {
        weekday: 'long',
        month: 'short',
        day: 'numeric',
        year: 'numeric'
      });

      localTimeEl.textContent = localTimeStr;
      localDateEl.textContent = localDateStr;

      const userTz = Intl.DateTimeFormat().resolvedOptions().timeZone;
      localTzNameEl.textContent = userTz.split('/')[1]?.replace('_', ' ') || userTz;
      
      const offsetMin = -now.getTimezoneOffset();
      const offsetHrs = Math.floor(Math.abs(offsetMin) / 60);
      const offsetMinsRem = Math.abs(offsetMin) % 60;
      const offsetSign = offsetMin >= 0 ? '+' : '-';
      localTzOffsetEl.textContent = `UTC ${offsetSign}${String(offsetHrs).padStart(2, '0')}:${String(offsetMinsRem).padStart(2, '0')}`;

      // 2. Render Cards Grid
      clocksGrid.innerHTML = "";

      activeTimezones.forEach(tz => {
        const cityData = CITY_DATABASE.find(c => c.tz === tz) || {
          name: tz.split('/')[1]?.replace('_', ' ') || tz,
          country: tz.split('/')[0],
          tz: tz
        };

        const card = createCityCard(cityData, now);
        clocksGrid.appendChild(card);
      });
    }

    function createCityCard(city, now) {
      const card = document.createElement("div");
      card.className = "city-card";

      // Time in target timezone
      const timeStr = now.toLocaleTimeString('en-US', {
        timeZone: city.tz,
        hour12: !is24Hour,
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });

      const dateStr = now.toLocaleDateString('en-US', {
        timeZone: city.tz,
        weekday: 'short',
        month: 'short',
        day: 'numeric'
      });

      // Day/Night Status Calculation
      const hourInTz = parseInt(now.toLocaleTimeString('en-US', { timeZone: city.tz, hour: '2-digit', hour12: false }));
      const isDay = hourInTz >= 6 && hourInTz < 18;

      // Time Difference Relative to Local
      const diffHrs = getTimeDifference(now, city.tz);
      let diffLabel = "Same time";
      if (diffHrs > 0) diffLabel = `+${diffHrs} hrs ahead`;
      else if (diffHrs < 0) diffLabel = `${diffHrs} hrs behind`;

      card.innerHTML = `
        <div class="city-card-header">
          <div>
            <div class="city-name">${city.name}</div>
            <div class="city-sub">${city.country}</div>
          </div>
          <div class="day-night-tag ${isDay ? 'tag-day' : 'tag-night'}">
            ${isDay ? '🌞 Day' : '🌙 Night'}
          </div>
        </div>

        <div class="city-time">${timeStr}</div>

        <div class="city-card-footer">
          <div>
            <span>${dateStr}</span> • <span style="color: var(--accent);">${diffLabel}</span>
          </div>
          <button class="remove-city-btn" title="Remove City" onclick="removeCity('${city.tz}')">
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
      `;

      return card;
    }

    function getTimeDifference(now, targetTz) {
      const localString = now.toLocaleString('en-US', { timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone });
      const targetString = now.toLocaleString('en-US', { timeZone: targetTz });

      const localDate = new Date(localString);
      const targetDate = new Date(targetString);

      const diffMs = targetDate - localDate;
      return Math.round(diffMs / (1000 * 60 * 60));
    }

    function removeCity(tz) {
      activeTimezones = activeTimezones.filter(item => item !== tz);
      localStorage.setItem("ethan_world_cities", JSON.stringify(activeTimezones));
      updateClocks();
    }

    /* Modal & Search Logic */
    addCityBtn.addEventListener("click", () => {
      renderSearchList("");
      addCityModal.classList.add("open");
      citySearchInput.focus();
    });

    closeModalBtn.addEventListener("click", () => {
      addCityModal.classList.remove("open");
    });

    citySearchInput.addEventListener("input", (e) => {
      renderSearchList(e.target.value.toLowerCase().trim());
    });

    function renderSearchList(filter) {
      tzList.innerHTML = "";
      const matches = CITY_DATABASE.filter(c => 
        !activeTimezones.includes(c.tz) &&
        (c.name.toLowerCase().includes(filter) || c.country.toLowerCase().includes(filter) || c.tz.toLowerCase().includes(filter))
      );

      if (matches.length === 0) {
        tzList.innerHTML = `<div style="font-size: 0.85rem; color: var(--text-muted); text-align: center; padding: 16px;">No available cities found.</div>`;
        return;
      }

      matches.forEach(c => {
        const item = document.createElement("div");
        item.className = "tz-item";
        item.innerHTML = `
          <div>
            <div class="tz-item-title">${c.name}</div>
            <div class="tz-item-sub">${c.country} (${c.tz})</div>
          </div>
          <span style="font-size: 0.8rem; color: var(--accent); font-weight: 700;">+ Add</span>
        `;

        item.addEventListener("click", () => {
          activeTimezones.push(c.tz);
          localStorage.setItem("ethan_world_cities", JSON.stringify(activeTimezones));
          addCityModal.classList.remove("open");
          updateClocks();
        });

        tzList.appendChild(item);
      });
    }

    /* Clock Loop */
    updateClocks();
    setInterval(updateClocks, 1000);
  </script>
</body>
</html>
