<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Broadcaster Control Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="thestyle.css">
  <style>
    /* Utility & View Management */
    .hidden {
      display: none !important;
    }

    /* Centered Glassmorphic Card Panel */
    .admin-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      backdrop-filter: blur(var(--glass-blur, 16px));
      padding: 32px 28px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      margin: 0 auto;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      text-align: left;
      margin-bottom: 20px;
    }

    .form-group label {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    input, textarea {
      background: var(--sky-a);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 12px 14px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      width: 100%;
    }

    /* Readonly style for unmodifiable inputs */
    input[readonly] {
      opacity: 0.75;
      cursor: not-allowed;
      user-select: none;
      border-color: rgba(255, 255, 255, 0.08);
    }

    input:focus:not([readonly]), textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(221, 156, 71, 0.2);
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    button.submit-btn {
      background: var(--accent);
      color: #0c1014;
      font-weight: 700;
      padding: 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: transform 0.15s ease, opacity 0.2s ease;
      width: 100%;
    }

    button.submit-btn:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    button.submit-btn:active {
      transform: translateY(0);
    }

    .error-msg {
      color: #ef4444;
      font-size: 0.85rem;
      margin-top: 8px;
      text-align: center;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-bottom: 20px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .action-btn {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .action-btn:hover {
      border-color: var(--accent);
      color: var(--text);
    }

    /* Broadcast Management Modal / Feed Drawer */
    .manage-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 320px;
      overflow-y: auto;
      margin: 16px 0;
      padding-right: 4px;
    }

    .manage-item {
      background: var(--sky-a);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .manage-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      width: 100%;
    }

    .manage-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      text-align: left;
      overflow: hidden;
    }

    .manage-info strong {
      font-size: 0.9rem;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .manage-info small {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .manage-actions {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-shrink: 0;
    }

    .delete-btn {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #ef4444;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .delete-btn:hover {
      background: #ef4444;
      color: #ffffff;
    }

    /* Inline Edit Form Styling */
    .inline-edit-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--card-border);
      width: 100%;
    }

    .inline-edit-form input, 
    .inline-edit-form textarea {
      padding: 8px 10px;
      font-size: 0.85rem;
    }

    .edit-btn-group {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    .save-btn {
      background: var(--accent);
      color: #0c1014;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
    }

    .cancel-btn {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .mini-clock-widget,
.mini-uptime-widget {
  position: fixed;
  bottom: 24px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  backdrop-filter: blur(var(--glass-blur));
  -webkit-backdrop-filter: blur(var(--glass-blur));
  padding: 10px 16px;
  border-radius: 12px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
  z-index: 999;
  pointer-events: none;
  user-select: none;
}

.mini-clock-widget {
  right: 24px;
  text-align: right;
}

.mini-uptime-widget {
  left: 24px;
  text-align: left;
}

.mini-clock-time {
  font-family: 'Fraunces', serif;
  font-size: 1.35rem;
  font-weight: 500;
  color: var(--gold);
  line-height: 1;
}

.mini-clock-time span.sec-text {
  font-size: 0.9rem;
  color: var(--text-muted);
  font-weight: 400;
}

.mini-clock-date {
  font-size: 0.72rem;
  color: var(--text-muted);
  margin-top: 4px;
  font-weight: 500;
  letter-spacing: 0.3px;
}
  </style>
</head>
<body>

  <!-- Main Centered Layout Wrap -->
  <div class="wrap">
    
    <!-- View 1: Password Gate -->
    <div id="loginView" class="admin-card">
      <div class="eyebrow" style="justify-content: center;">
        <span>Restricted Access</span>
      </div>
      <div class="greeting" style="margin-top: 8px;">Broadcaster Login</div>
      <div class="message" style="margin-bottom: 24px;">Enter password to proceed.</div>

      <form id="loginForm">
        <div class="form-group">
          <label for="adminPassword">Password</label>
          <input type="password" id="adminPassword" placeholder="Enter password..." required autocomplete="current-password" />
        </div>
        <button type="submit" class="submit-btn">Go To Panel</button>
        <div id="loginError" class="error-msg hidden">Invalid password. Please try again.</div>
      </form>
    </div>

    <!-- View 2: Main Broadcaster Panel -->
    <div id="panelView" class="admin-card hidden">
      <div class="header-bar">
        <div class="eyebrow">

        </div>
        <div class="header-actions">
          <button type="button" class="action-btn" id="manageBtn">Manage Feed</button>
          <button type="button" class="action-btn" id="logoutBtn">Lock Panel</button>
        </div>
      </div>

      <div class="greeting">Broadcast Assignment...</div>
      <div class="message" style="margin-bottom: 24px;">Publish new assignments to feed.</div>

      <form id="broadcastForm">
        <div class="form-group">
          <label for="title">Broadcast Time</label>
          <input type="text" id="title" readonly required />
        </div>

        <div class="form-group">
          <label for="timestamp">Tags</label>
          <input type="text" id="timestamp" placeholder="Add additional tags..." required />
        </div>

        <div class="form-group">
          <label for="content">Publishing Details</label>
          <textarea id="content" rows="4" placeholder="e.g., Mandarin: Read Chapter 4 and complete exercises..." required></textarea>
        </div>

        <button type="submit" class="submit-btn" id="publishBtn">Push Broadcast</button>
      </form>
    </div>

    <!-- View 3: Manage / Delete / Edit Broadcasts -->
    <div id="manageView" class="admin-card hidden">
      <div class="header-bar">
        <div class="eyebrow">
      
        </div>
        <button type="button" class="action-btn" id="backToStudioBtn">← Back</button>
      </div>

      <div class="greeting">Manage Broadcasts</div>
      <div class="message">Review or delete live broadcast items.</div>

      <div id="manageList" class="manage-list">
        <!-- Rendered dynamically -->
      </div>
    </div>

  </div>
<div class="mini-clock-widget">
  <div class="mini-clock-time">
    <span id="clockMain">00:00</span><span id="clockSec" class="sec-text">:00</span>
  </div>
  <div class="mini-clock-date" id="dateLine">Monday, January 1, 2026</div>
</div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const AUTH_PASS = 'ethanman25';
    const SUPABASE_URL = 'https://wmfjqnzxnyperjetckuq.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndtZmpxbnp4bnlwZXJqZXRja3VxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3NjE3NDQsImV4cCI6MjEwNDMzNzc0NH0.k-r5SOY_2GpHL5kS3-9lathbGYMUzecy-X8INLAk_Tw';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const loginView = document.getElementById('loginView');
    const panelView = document.getElementById('panelView');
    const manageView = document.getElementById('manageView');
    
    const loginForm = document.getElementById('loginForm');
    const loginError = document.getElementById('loginError');
    const logoutBtn = document.getElementById('logoutBtn');
    const manageBtn = document.getElementById('manageBtn');
    const backToStudioBtn = document.getElementById('backToStudioBtn');
    const broadcastForm = document.getElementById('broadcastForm');
    const publishBtn = document.getElementById('publishBtn');
    const manageList = document.getElementById('manageList');
    const titleInput = document.getElementById('title');

    // Store assignment records globally for inline editing
    window.currentAssignments = [];

    // Auto-update unmodifiable date & time input (24-Hour Format)
    function updateDateTimeField() {
      const now = new Date();
      const options = { 
        month: 'short', 
        day: 'numeric', 
        year: 'numeric', 
        hour: '2-digit', 
        minute: '2-digit',
        hour12: false 
      };
      titleInput.value = now.toLocaleString('en-US', options).replace(',', '');
    }
    setInterval(updateDateTimeField, 1000);
    updateDateTimeField();

    // Check existing session on load
    if (sessionStorage.getItem('admin_authenticated') === 'true') {
      loginView.classList.add('hidden');
      panelView.classList.remove('hidden');
    }

    // Handle Authentication
    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const inputPass = document.getElementById('adminPassword').value;

      if (inputPass === AUTH_PASS) {
        sessionStorage.setItem('admin_authenticated', 'true');
        loginError.classList.add('hidden');
        loginView.classList.add('hidden');
        panelView.classList.remove('hidden');
        loginForm.reset();
      } else {
        loginError.classList.remove('hidden');
      }
    });

    // Handle Logout / Lock
    logoutBtn.addEventListener('click', () => {
      sessionStorage.removeItem('admin_authenticated');
      panelView.classList.add('hidden');
      manageView.classList.add('hidden');
      loginView.classList.remove('hidden');
    });

    // Switch to Manage View
    manageBtn.addEventListener('click', () => {
      panelView.classList.add('hidden');
      manageView.classList.remove('hidden');
      loadManageList();
    });

    // Switch back to Main Studio View
    backToStudioBtn.addEventListener('click', () => {
      manageView.classList.add('hidden');
      panelView.classList.remove('hidden');
    });

    // Fetch and render existing broadcasts with Edit & Delete options
    async function loadManageList() {
      manageList.innerHTML = '<div style="color: var(--text-muted); text-align: center; font-size: 0.85rem;">Loading broadcasts...</div>';

      const { data, error } = await supabaseClient
        .from('assignments')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        manageList.innerHTML = `<div style="color: #ef4444; text-align: center; font-size: 0.85rem;">Error loading items: ${error.message}</div>`;
        return;
      }

      if (!data || data.length === 0) {
        manageList.innerHTML = '<div style="color: var(--text-muted); text-align: center; font-size: 0.85rem;">No active broadcasts found.</div>';
        return;
      }

      window.currentAssignments = data;

      manageList.innerHTML = data.map(item => `
        <div class="manage-item" id="item-${item.id}">
          <div class="manage-row">
            <div class="manage-info">
              <strong>${escapeHtml(item.title)}</strong>
              <small>${escapeHtml(item.timestamp)}</small>
            </div>
            <div class="manage-actions">
              <button type="button" class="action-btn" onclick="toggleEdit('${item.id}')">Edit</button>
              <button type="button" class="delete-btn" onclick="deleteBroadcast('${item.id}')">Delete</button>
            </div>
          </div>
          <div id="edit-form-${item.id}" class="inline-edit-form hidden">
            <input type="text" id="edit-title-${item.id}" value="${escapeHtml(item.title)}" placeholder="Broadcast Time" readonly required />
            <input type="text" id="edit-timestamp-${item.id}" value="${escapeHtml(item.timestamp)}" placeholder="Tags" required />
            <textarea id="edit-content-${item.id}" rows="3" placeholder="Publishing Details" required>${escapeHtml(item.content || '')}</textarea>
            <div class="edit-btn-group">
              <button type="button" class="cancel-btn" onclick="toggleEdit('${item.id}')">Cancel</button>
              <button type="button" class="save-btn" onclick="saveBroadcastEdit('${item.id}')">Save</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    // Toggle inline edit form visibility
    window.toggleEdit = function(id) {
      const form = document.getElementById(`edit-form-${id}`);
      if (form) {
        form.classList.toggle('hidden');
      }
    };

    // Save edited broadcast item back to Supabase
    window.saveBroadcastEdit = async function(id) {
      const title = document.getElementById(`edit-title-${id}`).value;
      const timestamp = document.getElementById(`edit-timestamp-${id}`).value;
      const content = document.getElementById(`edit-content-${id}`).value;

      const { error } = await supabaseClient
        .from('assignments')
        .update({ title, timestamp, content })
        .eq('id', id);

      if (error) {
        alert('Failed to update broadcast: ' + error.message);
      } else {
        loadManageList();
      }
    };

    // Delete single broadcast item from Supabase
    window.deleteBroadcast = async function(id) {
      if (!confirm('Are you sure you want to delete this broadcast?')) return;

      const { error } = await supabaseClient
        .from('assignments')
        .delete()
        .eq('id', id);

      if (error) {
        alert('Failed to delete broadcast: ' + error.message);
      } else {
        loadManageList();
      }
    };

    // Helper to sanitize rendered text
    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // Handle Supabase Broadcast Submission
    broadcastForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const title = document.getElementById('title').value;
      const timestamp = document.getElementById('timestamp').value;
      const content = document.getElementById('content').value;

      publishBtn.disabled = true;
      publishBtn.textContent = 'Broadcasting...';

      const { error } = await supabaseClient
        .from('assignments')
        .insert([{ title, timestamp, content }]);

      publishBtn.disabled = false;
      publishBtn.textContent = 'Push Broadcast';

      if (error) {
        alert('Failed to publish broadcast: ' + error.message);
      } else {
        alert('Broadcast published successfully!');
        document.getElementById('timestamp').value = '';
        document.getElementById('content').value = '';
      }
    });

    function updateClock() {
  const now = new Date();
  const hrs = String(now.getHours()).padStart(2, "0");
  const mins = String(now.getMinutes()).padStart(2, "0");
  const secs = String(now.getSeconds()).padStart(2, "0");

  document.getElementById("clockMain").textContent = `${hrs}:${mins}`;
  document.getElementById("clockSec").textContent = `:${secs}`;

  const options = {
    weekday: "long",
    year: "numeric",
    month: "long",
    day: "numeric"
  };

  document.getElementById("dateLine").textContent =
    now.toLocaleDateString("en-US", options);
}

function updateUptime() {
  const elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);
  const hrs = String(Math.floor(elapsedSeconds / 3600)).padStart(2, "0");
  const mins = String(Math.floor((elapsedSeconds % 3600) / 60)).padStart(2, "0");
  const secs = String(elapsedSeconds % 60).padStart(2, "0");

 
}

setInterval(() => {
  updateClock();
  updateUptime();
}, 1000);

updateClock();
updateUptime();
  </script>
</body>
</html>
