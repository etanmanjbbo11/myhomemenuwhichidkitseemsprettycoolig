<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment Broadcaster</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="thestyle.css">
</head>
<body>

  <!-- Top Header Action -->
  <div class="header-btns">
    <button class="icon-btn-circle" id="refreshBtn" aria-label="Reload Feed" title="Reload Feed">
      <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"></polyline>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
      </svg>
    </button>
    <a href="index.html" class="icon-btn-circle" id="homeBtn" aria-label="Go to Home" title="Home" style="text-decoration: none;">
      <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
    </a>
  </div>

  <!-- Main Centered Layout Container -->
  <div class="wrap">
    <div class="eyebrow">
      <span class="dot"></span>
      <span id="syncStatus">Loading...</span>
    </div>
    
    <h1 class="clock" id="clockMain">00:00<span class="sec" id="clockSec">:00</span></h1>
    <div class="date-line" id="dateLine">Loading sync schedule…</div>

    <div class="greeting">School Assignments</div>
    <div class="message">This site is still in beta. Expect issues.</div>

    <!-- Announcement Feed Grid (Matches app-card styling from inspiration) -->
    <div class="actions-grid" id="feed" style="width: 100%; max-width: 560px; text-align: left;">
      <div class="app-card" style="justify-content: center; color: var(--text-muted);">
        Connecting to broadcaster stream...
      </div>
    </div>
  </div>

 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
